
name: deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

# GitHub OIDC permissions
permissions:
  id-token: write
  contents: read

# Prevent simultaneous deployments
concurrency:
  group: deploy
  cancel-in-progress: false

# Environment variables
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_notify_email: ${{ vars.NOTIFY_EMAIL }}
  TF_INPUT: "false"

jobs:
  deploy:
    name: Deploy Exam Platform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 4. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # 5. Build Lambda deployment package
      - name: Build Lambda package
        working-directory: .
        run: |
          chmod +x scripts/build-lambda.sh
          ./scripts/build-lambda.sh

      # 6. Initialize Terraform with S3 remote backend
      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=exam-tsd/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      # 7. Validate Terraform configuration
      - name: Terraform validate
        run: terraform validate

      # 8. Create ECR repository before building the Docker image
      - name: Create ECR repository
        run: |
          terraform apply \
            -auto-approve \
            -target=aws_ecr_repository.api \
            -var="image_tag=${{ github.sha }}"

      # 9. Authenticate Docker with Amazon ECR
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 10. Build and push API Docker image
      - name: Build and push API image
        working-directory: app/api
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/exam-tsd-api

          docker build -t $IMAGE:${{ github.sha }} .

          docker push $IMAGE:${{ github.sha }}

      # 11. Deploy complete AWS infrastructure
      - name: Terraform apply - full stack
        run: |
          terraform apply \
            -auto-approve \
            -var="image_tag=${{ github.sha }}"

      # 12. Publish frontend files to S3
      - name: Publish frontend
        run: |
          BUCKET=$(terraform output -raw frontend_bucket)

          DIST=$(terraform output -raw cloudfront_distribution_id)

          aws s3 sync ../app/frontend s3://$BUCKET --delete

          aws cloudfront create-invalidation \
            --distribution-id $DIST \
            --paths "/*"

      # 13. Test application health
      - name: Smoke test
        run: |
          URL=$(terraform output -raw site_url)

          echo "Testing application: $URL/api/health"

          for i in $(seq 1 20); do
            if curl -fsS "$URL/api/health"; then
              echo "Application health check passed!"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 15
          done

          echo "Health check failed"
          exit 1
