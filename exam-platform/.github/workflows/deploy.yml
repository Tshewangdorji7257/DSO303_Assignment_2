name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC -> AWS, no stored access keys
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_region: ${{ secrets.AWS_REGION }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_VAR_notify_email: ${{ secrets.NOTIFY_EMAIL }}
  TF_INPUT: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Build Lambda package
        working-directory: .
        run: ./scripts/build-lambda.sh

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=exam-tsd/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      # The image must exist before the ECS service can start, so create ECR first
      - name: Create ECR repository
        run: terraform apply -auto-approve -target=aws_ecr_repository.api

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        working-directory: app/api
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/exam-tsd-api
          docker build -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}

      - name: Terraform apply (full stack)
        run: terraform apply -auto-approve -var="image_tag=${{ github.sha }}"

      - name: Publish frontend
        run: |
          BUCKET=$(terraform output -raw frontend_bucket)
          DIST=$(terraform output -raw cloudfront_distribution_id)
          aws s3 sync ../app/frontend s3://$BUCKET --delete
          aws cloudfront create-invalidation --distribution-id $DIST --paths "/*"

      - name: Smoke test
        run: |
          URL=$(terraform output -raw site_url)
          for i in $(seq 1 20); do
            curl -fsS "$URL/api/health" && exit 0
            sleep 15
          done
          echo "Health check failed"; exit 1

